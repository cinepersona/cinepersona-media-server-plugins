overview: "Automatically sync Jellyfin watched movies, TV episode progress, and personal ratings with CinePersona."
description: >
  Automatically records movies and TV episodes watched to at least 80 percent in CinePersona,
  supports bidirectional watched-state sync, and includes an optional Web rating and short-review dialog.
  The plugin reads only Jellyfin's local media metadata and sends events to the CinePersona URL
  configured by the server administrator.
